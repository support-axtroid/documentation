<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Knowledge Base</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>
  :root{
    --ink:#1C1B1F; --ink-soft:#262529; --ink-line:#38363B;
    --paper:#FAF8F4; --paper-raised:#FFFFFF; --paper-line:#E7E2D8;
    --text-main:#201F23; --text-muted:#6E6A66;
    --accent:#F2A23B; --accent-dark:#C97A1F;
    --gold:#E0A93C; --gold-soft:#F6E7C6;
    --sidebar-text:#D9D6D1; --sidebar-text-dim:#8D8A85; --sidebar-active:#302E33;
    --radius:8px;
    --font-display:'Segoe UI Semibold','Segoe UI',system-ui,-apple-system,sans-serif;
    --font-body:'Segoe UI',system-ui,-apple-system,sans-serif;
    --font-mono:'Segoe UI',Consolas,'Courier New',monospace;
    --sidebar-w:220px; --rightbar-w:260px; --rightbar-w-collapsed:48px;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;width:100%;}
  body{margin:0;font-family:var(--font-body);color:var(--text-main);background:var(--paper);-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  ::selection{background:var(--gold-soft);}

  .kb-shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr auto;grid-template-rows:auto 1fr auto;grid-template-areas:"topbar topbar topbar" "sidebar main rightbar" "footer footer footer";min-height:100vh;min-height:100dvh;max-width:100vw;overflow-x:hidden;}

  /* topbar */
  .topbar{grid-area:topbar;background:var(--ink);border-bottom:1px solid var(--ink-line);display:flex;align-items:center;gap:18px;padding:0 22px;height:62px;position:sticky;top:0;z-index:40;}
  .brand{display:flex;align-items:center;gap:10px;color:#fff;white-space:nowrap;font-family:var(--font-display);font-weight:700;font-size:1.05rem;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .brand-logo{height:48px;width:auto;display:block;flex-shrink:0;}
  .brand-logo-mobile{display:none;}
  .brand-text{display:flex;flex-direction:column;line-height:2.15;}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:1.52rem;color:var(--accent);}
  .brand-sub{font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;}
  .hamburger-btn{display:none;background:none;border:none;color:#fff;font-size:1.35rem;line-height:1;cursor:pointer;padding:4px 8px;margin-right:2px;border-radius:6px;}
  .hamburger-btn:hover{background:var(--ink-soft);}
  .site-footer{grid-area:footer;background:var(--ink);color:var(--sidebar-text-dim);text-align:center;font-size:.78rem;padding:14px 20px;border-top:1px solid var(--ink-line);}
  .site-footer a{color:var(--accent);}
  .sidebar-backdrop{display:none;}
  .rightbar-backdrop{display:none;}
  .rightbar-mobile-btn{display:none;background:none;border:1px solid var(--ink-line);color:#fff;width:34px;height:34px;flex-shrink:0;align-items:center;justify-content:center;border-radius:999px;font-size:1rem;line-height:1;cursor:pointer;}
  .rightbar-mobile-btn:hover{background:var(--ink-soft);}
  .brand{cursor:pointer;}
  .mode-toggle{display:flex;background:var(--ink-soft);border:1px solid var(--ink-line);border-radius:999px;padding:3px;gap:2px;}
  .mode-toggle button{background:none;border:none;color:var(--sidebar-text-dim);padding:6px 16px;border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer;}
  .mode-toggle button.active{background:var(--accent);color:var(--ink);}
  .search-wrap{flex:1;max-width:480px;margin-left:auto;position:relative;}
  .search-wrap input{width:100%;background:var(--ink-soft);border:1px solid var(--ink-line);color:#fff;padding:8px 14px 8px 34px;border-radius:999px;font-size:.85rem;font-family:var(--font-body);}
  .search-wrap input::placeholder{color:var(--sidebar-text-dim);}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--sidebar-text-dim);}
  .search-results{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--paper-raised);border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:400px;overflow-y:auto;z-index:60;}
  .search-wrap.has-results .search-results{display:block;}
  .search-result{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--paper-line);}
  .search-result:last-child{border-bottom:none;}
  .search-result:hover{background:#FBF1E1;}
  .search-result .r-title{font-size:.85rem;font-weight:600;}
  .search-result .r-path{font-size:.72rem;color:var(--text-muted);}
  .export-btn{background:var(--accent);color:var(--ink);border:none;padding:8px 16px;border-radius:999px;font-size:.82rem;font-weight:700;cursor:pointer;flex-shrink:0;}
  .export-btn:hover{background:var(--gold);}

  /* sidebar */
  .sidebar{grid-area:sidebar;background:var(--ink);color:var(--sidebar-text);border-right:1px solid var(--ink-line);display:flex;flex-direction:column;align-self:stretch;height:100%;}
  .sidebar-inner{display:flex;flex-direction:column;flex:1;position:sticky;top:62px;height:calc(100vh - 62px);height:calc(100dvh - 62px);overflow-y:auto;}
  .sidebar-section{padding:16px 14px 6px;}
  .sidebar-section + .sidebar-section{border-top:1px solid var(--ink-line);}
  .sidebar-heading{display:flex;align-items:center;justify-content:space-between;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--sidebar-text-dim);font-weight:700;margin-bottom:8px;padding:0 4px;}
  .icon-sm{background:none;border:none;color:var(--sidebar-text-dim);cursor:pointer;padding:2px 5px;border-radius:4px;font-size:1rem;line-height:1;}
  .icon-sm:hover{background:var(--sidebar-active);color:#fff;}
  select.product-select{width:100%;appearance:none;background:var(--ink-soft);border:1px solid var(--ink-line);color:#fff;font-family:var(--font-body);font-size:.84rem;font-weight:600;padding:8px 12px;border-radius:var(--radius);cursor:pointer;}
  .nav-tree{list-style:none;margin:0;padding:0 0 10px;}
  .nav-tree ul{list-style:none;margin:0;padding-left:14px;}
  .nav-node.is-open > ul{display:block;}
  .nav-node > ul{display:none;}
  .nav-row{display:flex;align-items:center;gap:6px;padding:6px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;color:var(--sidebar-text);}
  .nav-row:hover{background:var(--sidebar-active);}
  .nav-row.is-active{background:var(--sidebar-active);color:#fff;box-shadow:inset 2px 0 0 var(--accent);}
  .nav-toggle{width:14px;flex-shrink:0;display:inline-flex;transition:transform .12s;}
  .nav-node.is-open > .nav-row .nav-toggle{transform:rotate(90deg);}
  .nav-row-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-actions{display:none;gap:2px;flex-shrink:0;}
  .nav-row:hover .row-actions{display:flex;}
  .star-btn{background:none;border:none;padding:2px;color:var(--sidebar-text-dim);cursor:pointer;}
  .star-btn.is-fav{color:var(--gold);}
  .add-btn{display:flex;align-items:center;gap:6px;width:100%;background:none;border:1px dashed var(--ink-line);color:var(--sidebar-text-dim);padding:7px 10px;border-radius:6px;font-size:.78rem;cursor:pointer;margin-top:4px;}
  .add-btn:hover{border-color:var(--accent);color:var(--accent);}
  .sidebar-footer{margin-top:auto;padding:12px 14px;border-top:1px solid var(--ink-line);text-align:center;font-size:.72rem;color:var(--sidebar-text-dim);}

  /* rightbar */
  .rightbar{grid-area:rightbar;background:var(--paper-raised);border-left:1px solid var(--paper-line);padding:0;position:relative;align-self:stretch;height:100%;overflow:visible;transition:width .18s ease;width:var(--rightbar-w);flex-shrink:0;}
  .rightbar-body{position:sticky;top:62px;height:calc(100vh - 62px);height:calc(100dvh - 62px);overflow-y:auto;overflow-x:hidden;}
  .rightbar-toggle{position:absolute;top:4in;left:-13px;display:flex;align-items:center;justify-content:center;width:26px;height:56px;background:var(--paper-raised);border:1px solid var(--paper-line);border-right:none;border-radius:8px 0 0 8px;color:var(--text-muted);cursor:pointer;font-size:.85rem;box-shadow:-2px 2px 8px rgba(0,0,0,.1);z-index:5;}
  .rightbar-toggle:hover{background:#F1ECE1;color:var(--ink);}
  .rightbar.collapsed{width:var(--rightbar-w-collapsed);}
  .rightbar.collapsed .rightbar-body{display:none;}
  .rightbar-section{padding:16px 14px 6px;}
  .rightbar-section + .rightbar-section{border-top:1px solid var(--paper-line);}
  .rightbar-heading{font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:8px;padding:0 4px;}
  .fav-list, .general-list{list-style:none;margin:0 0 6px;padding:0;}
  .fav-list li a, .general-list li a{display:flex;align-items:flex-start;gap:8px;padding:6px 6px;border-radius:6px;font-size:.82rem;color:var(--text-main);}
  .fav-list li a:hover, .general-list li a:hover, .general-list li a.is-active{background:#F1ECE1;}
  .fav-empty{font-size:.76rem;color:var(--text-muted);padding:2px 6px 8px;line-height:1.5;}
  .fav-star{line-height:1.3;}
  .fav-text{display:flex;flex-direction:column;min-width:0;}
  .fav-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fav-product{font-size:.7rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* "What You Will Find" quick-nav — bold + accent-highlighted while its section is in view */
  #topicSummaryList li a{transition:color .12s,background .12s;}
  #topicSummaryList li a.is-active{background:#F1ECE1;color:var(--accent-dark);font-weight:700;}

  /* main */
  .main{grid-area:main;padding:36px 48px 80px;max-width:820px;}
  .breadcrumb{font-size:.8rem;color:var(--text-muted);margin-bottom:16px;}
  .history-back-home{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;color:var(--accent-dark);margin-bottom:14px;cursor:pointer;}
  .history-back-home:hover{text-decoration:underline;}
  .article-kicker{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:8px;}
  h1.article-title{font-family:var(--font-display);font-size:2.1rem;font-weight:700;margin:0 0 10px;color:var(--ink);}
  .article-meta{display:flex;align-items:center;gap:12px;font-size:.8rem;color:var(--text-muted);}
  .fav-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--paper-line);background:var(--paper-raised);padding:5px 12px;border-radius:999px;font-size:.78rem;cursor:pointer;color:var(--text-main);margin-left:auto;}
  .fav-toggle.is-fav{color:#8A6416;border-color:var(--gold-soft);background:var(--gold-soft);}
  .article-body{font-size:1rem;line-height:1.75;margin-top:24px;}
  .article-body h1{font-family:var(--font-display);font-size:1.7rem;font-weight:700;margin:32px 0 12px;color:var(--ink);}
  .article-body h2{font-family:var(--font-display);font-size:1.35rem;font-weight:700;margin:28px 0 10px;color:var(--ink);}
  .article-body h3{font-size:1.08rem;font-weight:600;margin:20px 0 8px;color:var(--ink);}
  .article-body h1:first-child,.article-body h2:first-child,.article-body h3:first-child{margin-top:0;}
  .article-body p{margin:0 0 14px;}
  .article-body ul,.article-body ol{margin:0 0 14px;padding-left:22px;}
  .article-body li{margin-bottom:5px;}
  .article-body pre{background:#1E1E2E;color:#CDD6F4;border-radius:var(--radius);padding:12px 14px;overflow-x:auto;font-family:Consolas,'Courier New',monospace;font-size:.85rem;line-height:1.5;white-space:pre;}
  .article-body code{font-family:Consolas,'Courier New',monospace;background:#EFEAE0;padding:1px 5px;border-radius:3px;font-size:.88em;color:#B3261E;}
  /* Unified text block in preview */
  .article-body .rte-content{margin-bottom:14px;}
  .article-body .rte-content h1{font-family:var(--font-display);font-size:1.7rem;font-weight:700;margin:28px 0 10px;color:var(--ink);}
  .article-body .rte-content h2{font-family:var(--font-display);font-size:1.35rem;font-weight:700;margin:22px 0 8px;color:var(--ink);}
  .article-body .rte-content h3{font-size:1.08rem;font-weight:600;margin:16px 0 6px;color:var(--ink);}
  .article-body .rte-content p{margin:0 0 12px;}
  .article-body .rte-content ul,.article-body .rte-content ol{margin:0 0 12px;padding-left:22px;}
  .article-body .rte-content li{margin-bottom:4px;}
  /* Tables in preview (rte-content blocks) */
  .article-body .rte-content table{border-collapse:collapse;width:100%;margin:10px 0;display:table;}
  .article-body .rte-content table td,.article-body .rte-content table th{border:1px solid var(--paper-line);padding:6px 10px;font-size:.9rem;min-width:60px;}
  .article-body .rte-content table th{background:#F3EFE6;font-weight:700;}
  /* Also fix any standalone table in article-body */
  .article-body table{border-collapse:collapse;width:100%;margin:10px 0;display:table;overflow-x:auto;}
  .article-body table td,.article-body table th{border:1px solid var(--paper-line);padding:6px 10px;font-size:.9rem;min-width:60px;}
  .article-body table th{background:#F3EFE6;font-weight:700;}
  /* Inline callouts from RTE — match internal callout block style */
  .article-body .rte-callout{display:flex;gap:12px;border-left:3px solid var(--accent);background:#FBF1E1;padding:13px 16px;border-radius:0 var(--radius) var(--radius) 0;margin:18px 0;font-size:.92rem;line-height:1.5;}
  .article-body .rte-callout .rte-callout-icon{width:18px;height:18px;flex-shrink:0;margin-top:2px;color:var(--accent-dark);}
  .article-body .rte-callout .rte-callout-icon svg{width:18px;height:18px;}
  .article-body .rte-callout .rte-callout-inner{flex:1;min-width:0;}
  .article-body .rte-callout .rte-callout-title{font-weight:700;margin-bottom:3px;}
  .article-body .rte-callout.rte-callout-note{border-left-color:#2E5F9E;background:#E7EEF7;}
  .article-body .rte-callout.rte-callout-note .rte-callout-icon,.article-body .rte-callout.rte-callout-note .rte-callout-title{color:#2E5F9E;}
  .article-body .rte-callout.rte-callout-tip{border-left-color:#2F7A34;background:#E5F2E3;}
  .article-body .rte-callout.rte-callout-tip .rte-callout-icon,.article-body .rte-callout.rte-callout-tip .rte-callout-title{color:#2F7A34;}
  .article-body .rte-callout.rte-callout-warning{border-left-color:var(--accent-dark);background:#FBF1E1;}
  .article-body .rte-callout.rte-callout-warning .rte-callout-icon,.article-body .rte-callout.rte-callout-warning .rte-callout-title{color:var(--accent-dark);}
  .article-body .rte-callout.rte-callout-caution{border-left-color:#B3261E;background:#FBE9E7;}
  .article-body .rte-callout.rte-callout-caution .rte-callout-icon,.article-body .rte-callout.rte-callout-caution .rte-callout-title{color:#B3261E;}
  .article-body .rte-callout.rte-callout-important{border-left-color:#6B4FA0;background:#EFE7F7;}
  .article-body .rte-callout.rte-callout-important .rte-callout-icon,.article-body .rte-callout.rte-callout-important .rte-callout-title{color:#6B4FA0;}
  .article-body figure{margin:20px 0;}
  .article-body img{display:block;max-width:100%;height:auto;border-radius:var(--radius);border:1px solid var(--paper-line);cursor:zoom-in;}
  .img-lightbox-overlay{position:fixed;inset:0;background:rgba(15,14,16,.86);display:flex;align-items:center;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:opacity .15s ease;padding:24px;}
  .img-lightbox-overlay.is-open{opacity:1;pointer-events:auto;}
  .img-lightbox-overlay img{max-width:92vw;max-height:92vh;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.55);}
  .article-body figcaption{margin-top:6px;font-size:.78rem;color:var(--text-muted);text-align:center;}
  .topic-feedback{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:36px 0 8px;padding:14px 16px;border:1px solid var(--paper-line);border-radius:var(--radius);background:#FBF9F5;font-size:.88rem;color:var(--text-main);}
  .topic-feedback-buttons{display:flex;gap:8px;}
  .feedback-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--paper-line);background:var(--paper-raised);padding:6px 14px;border-radius:999px;font-size:.85rem;cursor:pointer;color:var(--text-main);}
  .feedback-btn:hover{border-color:var(--accent);color:var(--accent-dark);}
  .feedback-btn.is-picked{background:var(--gold-soft);border-color:var(--gold);color:#8A6416;}
  .topic-feedback.is-answered .topic-feedback-question{color:var(--text-muted);}
  .callout{display:flex;gap:12px;border-left:3px solid var(--accent);background:#FBF1E1;padding:13px 16px;border-radius:0 var(--radius) var(--radius) 0;margin:18px 0;font-size:.92rem;}
  .callout-icon{width:18px;height:18px;flex-shrink:0;margin-top:1px;}
  .callout-title{font-weight:700;margin-bottom:3px;}
  .callout-body p{margin:0;}
  .callout-note{border-left-color:#2E5F9E;background:#E7EEF7;} .callout-note .callout-title,.callout-note .callout-icon{color:#2E5F9E;}
  .callout-tip{border-left-color:#2F7A34;background:#E5F2E3;} .callout-tip .callout-title,.callout-tip .callout-icon{color:#2F7A34;}
  .callout-important{border-left-color:#6B4FA0;background:#EFE7F7;} .callout-important .callout-title,.callout-important .callout-icon{color:#6B4FA0;}
  .callout-warning{border-left-color:var(--accent-dark);background:#FBF1E1;} .callout-warning .callout-title,.callout-warning .callout-icon{color:var(--accent-dark);}
  .callout-caution{border-left-color:#B3261E;background:#FBE9E7;} .callout-caution .callout-title,.callout-caution .callout-icon{color:#B3261E;}
  .changelog-entry{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--paper-line);}
  .changelog-date{font-family:var(--font-mono);font-size:.76rem;color:var(--text-muted);width:96px;flex-shrink:0;padding-top:2px;}
  .changelog-tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-bottom:5px;}
  .changelog-tag.added{background:#E5F2E3;color:#2F7A34;} .changelog-tag.updated{background:#E7EEF7;color:#2E5F9E;} .changelog-tag.removed{background:#FBE9E7;color:#B3261E;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}

  /* ---------------- home / welcome screen ---------------- */
  .home-hero{max-width:640px;margin:0 auto 30px;text-align:center;}
  .home-hero-logo{height:52px;width:auto;margin:0 auto 14px;display:block;}
  .home-kicker{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:10px;}
  .home-title{font-family:var(--font-display);font-size:1.9rem;font-weight:700;color:var(--ink);margin:0 0 10px;}
  .home-sub{font-size:.95rem;color:var(--text-muted);margin:0 0 22px;}
  .home-search-wrap{position:relative;max-width:480px;margin:0 auto;}
  .home-search-wrap input{width:100%;background:var(--paper-raised);border:1px solid var(--paper-line);color:var(--text-main);padding:12px 16px 12px 40px;border-radius:999px;font-size:.92rem;font-family:var(--font-body);box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .home-search-wrap input::placeholder{color:var(--text-muted);}
  .home-search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text-muted);}
  .home-search-wrap .search-results{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--paper-raised);border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:360px;overflow-y:auto;z-index:20;text-align:left;}
  .home-search-wrap.has-results .search-results{display:block;}
  .home-product-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 28px;}
  .home-product-tab{background:var(--paper-raised);border:1px solid var(--paper-line);border-radius:999px;padding:9px 18px;font-size:.86rem;font-weight:600;color:var(--text-main);cursor:pointer;}
  .home-product-tab:hover{border-color:var(--accent);color:var(--accent-dark);}
  .home-product-tab.is-active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .home-faq-heading{max-width:640px;margin:0 auto 12px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;color:var(--ink);text-align:center;}
  .home-faq-list{display:grid;gap:10px;max-width:640px;margin:0 auto;}
  .home-faq-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper-raised);border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px 16px;font-size:.9rem;font-weight:600;color:var(--text-main);cursor:pointer;text-align:left;width:100%;}
  .home-faq-item:hover{border-color:var(--accent);}

  @media (max-width:1180px){

    .fav-toggle{margin-right:8px;}
    .print-menu{margin-left:0;margin-right:2px;}

  /* keep any long words, URLs, or tables from forcing horizontal scroll on narrow screens */
  .main, .article-body{max-width:100%;overflow-wrap:anywhere;word-break:break-word;}
  /* article-body table overflow handled by rte-content rule above (display:table with overflow-x wrapper) */

  /* revert button (kept outside the editor-only block above so it also
     survives into the published static site's stylesheet) */
  .revert-btn{background:var(--ink-soft);color:#8D8A85;border:1px solid var(--ink-line);padding:8px 16px;border-radius:999px;font-size:.82rem;font-weight:700;cursor:not-allowed;flex-shrink:0;opacity:.5;}
  .revert-btn.is-active{color:#fff;cursor:pointer;opacity:1;}

  /* submit-a-request button + ticket modal */
  .submit-request-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 20px);margin:8px 10px 12px;background:var(--accent);color:var(--ink);border:none;padding:9px 10px;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;}

  /* ---------------- print (per-topic Print / Save as PDF) ---------------- */
  .print-menu{position:relative;display:inline-flex;margin-left:8px;}

  @keyframes preloaderFade{0%,100%{opacity:.45;}50%{opacity:1;}}

    function wildScore(query,target){
      if(!query) return 0;
      query=query.toLowerCase(); target=(target||'').toLowerCase();
      var direct=target.indexOf(query);
      if(direct>-1) return 1000-direct;
      var ti=0,gap=0,matched=0;
      for(var qi=0;qi<query.length;qi++){
        var ch=query[qi],found=-1;
        for(var j=ti;j<target.length;j++){ if(target[j]===ch){found=j;break;} }
        if(found===-1) continue;
        matched++; gap+=(found-ti); ti=found+1;
      }
      if(matched<Math.max(1,Math.ceil(query.length*0.6))) return -1;
      return 200+matched*10-gap;
    }
    function buildIdx(){var idx=[];data.topics.forEach(function(t){var sec=getSection(t.sectionId);if(!sec)return;var prod=getProduct(sec.productId);if(!prod)return;var bodyText='';if(t._loaded&&t.blocks){bodyText=t.blocks.map(function(b){return b.text!=null?b.text:(b.html||'').replace(/<[^>]+>/g,' ');}).join(' ');}idx.push({id:t.id,title:t.title,path:prod.name+' › '+sec.title,body:bodyText});});return idx;}
    function wildFilter(idx,q){
      var out=[];
      idx.forEach(function(e){
        var sTitle=wildScore(q,e.title)*3, sPath=wildScore(q,e.path), sBody=e.body?wildScore(q,e.body):-1;
        var best=Math.max(sTitle>0?sTitle:-1,sPath,sBody);
        if(best>0) out.push({entry:e,score:best});
      });
      out.sort(function(a,b){return b.score-a.score;});
      return out.map(function(o){return o.entry;});
    }
    var wrap=document.getElementById('searchWrap'),input=document.getElementById('kbSearch'),results=document.getElementById('searchResults');
    input.addEventListener('input',function(){

      results.innerHTML=m.length?m.map(function(e){return '<div class="search-result" data-goto="'+e.id+'"><div class="r-title">'+esc(e.title)+'</div><div class="r-path">'+esc(e.path)+'</div></div>';}).join(''):'<div class="search-result">No matches.</div>';
      wrap.classList.add('has-results');

    (function(){
      var shell=document.getElementById('kbShell'), backdrop=document.getElementById('sidebarBackdrop');

    /* Stretchable + collapsible left (navigation) sidebar — same
       collapse/resize behaviour as the editor, so the published site's
       sidebar can be toggled and dragged too. */
    (function(){
      var shell=document.getElementById('kbShell'), sidebar=document.getElementById('sidebar'),
          toggle=document.getElementById('sidebarToggle'), resizer=document.getElementById('sidebarResizer');
      if (!shell || !sidebar || !toggle || !resizer) return;
      var MIN_W=180, MAX_W=440;
      var savedW=null;
      try{ savedW=parseInt(localStorage.getItem('kb_sidebar_w'),10); }catch(e){}
      if (savedW && savedW>=MIN_W && savedW<=MAX_W){ document.documentElement.style.setProperty('--sidebar-w', savedW+'px'); }
      var collapsed=false;
      try{ collapsed = localStorage.getItem('kb_sidebar_collapsed')==='1'; }catch(e){}
      function applyCollapsed(){
        shell.classList.toggle('sidebar-collapsed', collapsed);
        toggle.textContent = collapsed?'›':'‹';
        toggle.title = collapsed?'Expand sidebar':'Collapse sidebar';
        toggle.setAttribute('aria-expanded', String(!collapsed));
      }
      applyCollapsed();
      toggle.addEventListener('click', function(){
        collapsed=!collapsed;
        applyCollapsed();
        try{ localStorage.setItem('kb_sidebar_collapsed', collapsed?'1':'0'); }catch(e){}
      });
      var dragging=false, startX=0, startW=0;
      resizer.addEventListener('mousedown', function(e){
        if (collapsed || window.matchMedia('(max-width:1180px)').matches) return;
        dragging=true; startX=e.clientX; startW=sidebar.getBoundingClientRect().width;
        resizer.classList.add('is-dragging');
        document.body.style.userSelect='none';
        e.preventDefault();
      });
      window.addEventListener('mousemove', function(e){
        if (!dragging) return;
        var w=Math.max(MIN_W, Math.min(MAX_W, startW + (e.clientX-startX)));
        document.documentElement.style.setProperty('--sidebar-w', w+'px');
      });
      window.addEventListener('mouseup', function(){
        if (!dragging) return;
        dragging=false;
        resizer.classList.remove('is-dragging');
        document.body.style.userSelect='';
        try{
          var w=getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w');
          localStorage.setItem('kb_sidebar_w', parseInt(w,10));
        }catch(e){}
      });
    })();

    /* ---------- Submit a Request (ticket) modal ----------
       Visitors of the published site are anonymous and the site is
       public, so it must never ship a GitHub write-token in its JS —
       anyone could read it via view-source and use it against the
       whole repo. Instead the ticket payload is POSTed to a small
       relay (Cloudflare Worker or similar) that holds the token
       server-side and appends it to tickets.json on GitHub's behalf.
       Reading tickets.json back (elsewhere, e.g. support-tickets.html)
       stays a plain unauthenticated GitHub API call, since reads of a
       public repo need no token at all — only the write does. */
    (function(){
      var GH = window.__GH_CONFIG__ || {settings:{}};
      var RELAY = GH.settings.ticketsRelayUrl || '';
      function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }
      function today(){ var d=new Date(); var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear(); }
      function ticketProductOptions(){ return data.products.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join(''); }
      function refreshTicketSections(){
        var pid=document.getElementById('ticketProduct').value;
        document.getElementById('ticketSection').innerHTML = sectionsFor(pid).map(function(s){return '<option value="'+s.id+'">'+esc(s.title)+'</option>';}).join('');
        refreshTicketTopics();
      }
      function refreshTicketTopics(){
        var sid=document.getElementById('ticketSection').value;
        document.getElementById('ticketTopic').innerHTML = topicsFor(sid).map(function(t){return '<option value="'+t.id+'">'+esc(t.title)+'</option>';}).join('');
      }
      openTicketModal = function(){
        document.getElementById('ticketProduct').innerHTML = ticketProductOptions();
        refreshTicketSections();
        document.getElementById('ticketQuery').innerHTML = '';
        document.getElementById('ticketEmail').value = '';
        document.getElementById('ticketFormView').style.display='block';
        document.getElementById('ticketSuccessView').style.display='none';
        document.getElementById('ticketOverlay').classList.add('is-open');
      };
      function closeTicketModal(){ document.getElementById('ticketOverlay').classList.remove('is-open'); }
      document.getElementById('ticketCloseX').addEventListener('click', closeTicketModal);
      document.getElementById('ticketCloseBtn').addEventListener('click', closeTicketModal);
      document.getElementById('ticketOverlay').addEventListener('click', function(e){ if(e.target===this) closeTicketModal(); });
      document.getElementById('ticketProduct').addEventListener('change', refreshTicketSections);
      document.getElementById('ticketSection').addEventListener('change', refreshTicketTopics);
      document.getElementById('ticketInsertImgBtn').addEventListener('click', function(){ document.getElementById('ticketImgFile').click(); });
      document.getElementById('ticketImgFile').addEventListener('change', function(){
        var file=this.files[0]; if(!file) return;
        var reader=new FileReader();
        reader.onload=function(){ var img=document.createElement('img'); img.src=reader.result; document.getElementById('ticketQuery').appendChild(img); };
        reader.readAsDataURL(file);
        this.value='';
      });
      function persistTicket(ticket){
        if (!RELAY){
          console.warn('No tickets relay URL configured — keeping ticket on this device only. Set one in ⚙ GitHub Settings.');
          try{ var p=JSON.parse(localStorage.getItem('kb_pending_tickets')||'[]'); p.push(ticket); localStorage.setItem('kb_pending_tickets', JSON.stringify(p)); }catch(e2){}
          return Promise.resolve();
        }
        return fetch(RELAY+'/submit-ticket', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ owner:GH.settings.owner, repo:GH.settings.repo, branch:GH.settings.branch, path:GH.settings.path, ticket:ticket })
        }).then(function(r){
          if (!r.ok) return r.json().catch(function(){return {};}).then(function(j){ throw new Error(j.error||('relay failed ('+r.status+')')); });
          return r.json();
        }).catch(function(e){
          console.error('Ticket sync failed, keeping locally', e);
          try{ var pending=JSON.parse(localStorage.getItem('kb_pending_tickets')||'[]'); pending.push(ticket); localStorage.setItem('kb_pending_tickets', JSON.stringify(pending)); }catch(e2){}
        });
      }
      document.getElementById('ticketSubmitBtn').addEventListener('click', function(){
        var email=document.getElementById('ticketEmail').value.trim();
        if (!email || email.indexOf('@')===-1){ alert('Please enter a valid email address.'); return; }
        var prod=getProduct(document.getElementById('ticketProduct').value);
        var sec=getSection(document.getElementById('ticketSection').value);
        var top=getTopic(document.getElementById('ticketTopic').value);
        var ticket={ id:uid('tick'), date:today(), product:prod?prod.name:'', section:sec?sec.title:'', topic:top?top.title:'',
          query:document.getElementById('ticketQuery').innerHTML, email:email, status:'open' };
        document.getElementById('ticketSubmitBtn').disabled=true;
        persistTicket(ticket).then(function(){
          document.getElementById('ticketSubmitBtn').disabled=false;
          document.getElementById('ticketFormView').style.display='none';
          document.getElementById('ticketSuccessView').style.display='block';
        });
      });
    })();
  })();</script></body></html>
